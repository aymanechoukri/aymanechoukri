<svg xmlns="http://www.w3.org/2000/svg" width="293.3333333333333" height="222" viewBox="0 0 293.3333333333333 222" role="img" aria-label="CODE: API driven. Web apps connected to public APIs and external services."><title>CODE: API driven. Web apps connected to public APIs and external services.</title><style>
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes pop{0%{opacity:0;transform:scale(.3)}70%{opacity:1;transform:scale(1.15)}100%{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes tilein{0%{opacity:0;transform:translateY(90px) scale(.6) rotate(-9deg)}55%{opacity:1;transform:translateY(-10px) scale(1.05) rotate(2deg)}100%{opacity:1;transform:none}}
@keyframes sheen{0%{transform:translateX(-220px) skewX(-20deg)}22%,100%{transform:translateX(380px) skewX(-20deg)}}
.r{opacity:0;animation:rise .8s cubic-bezier(.2,.7,.2,1) both;transform-box:fill-box}
.f{opacity:0;animation:fade .9s ease-out both}
.g{transform-box:fill-box;transform-origin:bottom;transform:scaleY(0);animation:grow .8s ease both}
.p{opacity:0;transform-box:fill-box;animation:pop .4s ease-out both}
.live{animation:pulse 1.6s ease-in-out infinite}
.ti{opacity:0;transform-box:fill-box;animation:tilein 1.1s cubic-bezier(.2,.8,.2,1) both}
.sh{animation:sheen 5s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){.r,.f,.g,.p,.live,.ti,.sh{animation:none!important;opacity:1!important;transform:none!important}.sh{display:none}}
</style><g transform="translate(4 0)">
<defs>
 <clipPath id="clip"><rect width="285.3333333333333" height="210" rx="14"/></clipPath>
 <linearGradient id="shine" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".32"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
</defs>
<g class="ti" style="animation-delay:3.35s">
 <g clip-path="url(#clip)">
  <rect width="285.3333333333333" height="210" rx="14" fill="#211f1d"/>
  <rect class="sh" x="0" y="-10" width="72" height="230" fill="url(#shine)" style="animation-delay:4.75s"/>
 </g>
 <text class="r" style="animation-delay:3.70s" x="24" y="38" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="12" letter-spacing="1.2" fill="#ffffff">CODE</text>
 <text class="r" style="animation-delay:3.85s" x="250" y="38" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="14" fill="#ffffff">↗</text>
 <g class="r" style="animation-delay:3.75s"><text x="22" y="112" font-family="Georgia, 'Times New Roman', serif" font-size="42" fill="#ffffff">API <tspan font-style="italic">driven</tspan></text></g>
 <text class="r" style="animation-delay:4.10s" x="24" y="150" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#ffffff">Web apps connected to public APIs</text><text class="r" style="animation-delay:4.20s" x="24" y="170" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#ffffff">and external services.</text>
</g>
</g></svg>