<svg xmlns="http://www.w3.org/2000/svg" width="880" height="352" viewBox="0 0 880 352" role="img" aria-label="Monthly contributions, streak and activity statistics"><title>Monthly contributions, streak and activity statistics</title><style>
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes pop{0%{opacity:0;transform:scale(.3)}70%{opacity:1;transform:scale(1.15)}100%{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes tilein{0%{opacity:0;transform:translateY(90px) scale(.6) rotate(-9deg)}55%{opacity:1;transform:translateY(-10px) scale(1.05) rotate(2deg)}100%{opacity:1;transform:none}}
@keyframes sheen{0%{transform:translateX(-220px) skewX(-20deg)}22%,100%{transform:translateX(380px) skewX(-20deg)}}
.r{opacity:0;animation:rise .8s cubic-bezier(.2,.7,.2,1) both;transform-box:fill-box}
.f{opacity:0;animation:fade .9s ease-out both}
.g{transform-box:fill-box;transform-origin:bottom;transform:scaleY(0);animation:grow .8s ease both}
.p{opacity:0;transform-box:fill-box;animation:pop .4s ease-out both}
.live{animation:pulse 1.6s ease-in-out infinite}
.ti{opacity:0;transform-box:fill-box;animation:tilein 1.1s cubic-bezier(.2,.8,.2,1) both}
.sh{animation:sheen 5s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){.r,.f,.g,.p,.live,.ti,.sh{animation:none!important;opacity:1!important;transform:none!important}.sh{display:none}}
</style><rect width="880" height="340" rx="14" fill="#f3f0e9"/><text class="f" style="animation-delay:1.90s" x="38" y="54" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="11" letter-spacing="1" fill="#81766d">THE LAST 12 MONTHS ON GITHUB</text><text class="r" style="animation-delay:2.00s" x="36" y="108" font-family="Georgia, 'Times New Roman', serif" font-size="48" fill="#211f1d">327 <tspan font-style="italic">contributions</tspan></text><path d="M610 90V306" stroke="#d8cec2"/><rect class="g" style="animation-delay:2.10s" x="36" y="259" width="40" height="31" rx="4" fill="#b9afa4"><title>Dec: 15 contributions</title></rect><text class="f" style="animation-delay:2.15s" x="56.0" y="312" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="10" fill="#81766d">Dec</text><rect class="g" style="animation-delay:2.16s" x="85" y="221" width="40" height="69" rx="4" fill="#b9afa4"><title>Jan: 33 contributions</title></rect><text class="f" style="animation-delay:2.21s" x="105.0" y="312" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="10" fill="#81766d">Jan</text><rect class="g" style="animation-delay:2.22s" x="134" y="254" width="40" height="36" rx="4" fill="#b9afa4"><title>Feb: 17 contributions</title></rect><text class="f" style="animation-delay:2.27s" x="154.0" y="312" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="10" fill="#81766d">Feb</text><rect class="g" style="animation-delay:2.28s" x="183" y="244" width="40" height="46" rx="4" fill="#b9afa4"><title>Mar: 22 contributions</title></rect><text class="f" style="animation-delay:2.33s" x="203.0" y="312" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="10" fill="#81766d">Mar</text><rect class="g" style="animation-delay:2.34s" x="232" y="282" width="40" height="8" rx="4" fill="#b9afa