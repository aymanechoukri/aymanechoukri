<svg xmlns="http://www.w3.org/2000/svg" width="880.000" height="432" viewBox="0 0 880.000 432" role="img" aria-label="Aymane Chokri. Full-stack web developer in Morocco."><title>Aymane Chokri. Full-stack web developer in Morocco.</title><style>
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes pop{0%{opacity:0;transform:scale(.3)}70%{opacity:1;transform:scale(1.15)}100%{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes nudge{0%,100%{transform:none}50%{transform:translateX(4px)}}
@keyframes nudgeup{0%,100%{transform:none}50%{transform:translate(3px,-3px)}}
.r{opacity:0;animation:rise .8s cubic-bezier(.2,.7,.2,1) both;transform-box:fill-box}
.f{opacity:0;animation:fade .9s ease-out both}
.g{transform-box:fill-box;transform-origin:bottom;transform:scaleY(0);animation:grow .8s cubic-bezier(.2,.7,.2,1) both}
.p{opacity:0;transform-box:fill-box;transform-origin:center;animation:pop .4s ease-out both}
.live{animation:pulse 1.6s ease-in-out infinite}
.n{transform-box:fill-box;animation:nudge 1.8s ease-in-out infinite}
.nu{transform-box:fill-box;animation:nudgeup 1.8s ease-in-out infinite}
@keyframes tilein{0%{opacity:0;transform:translateY(90px) scale(.6) rotate(-9deg)}55%{opacity:1;transform:translateY(-10px) scale(1.05) rotate(2deg)}75%{transform:translateY(3px) scale(.98) rotate(-.8deg)}90%{transform:translateY(-1px) scale(1.01) rotate(.2deg)}100%{opacity:1;transform:none}}
@keyframes slidein{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}
@keyframes arrowin{0%{opacity:0;transform:translateX(-30px)}60%{opacity:1;transform:translateX(6px)}100%{opacity:1;transform:none}}
@keyframes roll{from{transform:translateY(60px)}to{transform:none}}
@keyframes sheen{0%{transform:translateX(-260px) skewX(-20deg)}22%,100%{transform:translateX(420px) skewX(-20deg)}}
@keyframes ring{0%{opacity:.7;transform:scale(.2)}100%{opacity:0;transform:scale(2.4)}}
.ti{opacity:0;transform-box:fill-box;transform-origin:50% 60%;animation:tilein 1.1s cubic-bezier(.2,.8,.2,1) both}
.sl{opacity:0;transform-box:fill-box;animation:slidein .6s cubic-bezier(.2,.7,.2,1) both}
.ai{opacity:0;transform-box:fill-box;animation:arrowin .7s cubic-bezier(.2,.7,.2,1) both}
.ro{transform-box:fill-box;animation:roll .8s cubic-bezier(.15,.8,.2,1) both}
.sh{animation:sheen 5s ease-in-out infinite}
.rg{opacity:0;transform-box:fill-box;transform-origin:center;animation:ring 1s ease-out both}
@media (prefers-reduced-motion: reduce){.r,.f,.g,.p,.live,.n,.nu,.ti,.sl,.ai,.ro,.rg{animation:none!important;opacity:1!important;transform:none!important}.sh,.rg{display:none}}
</style>
<defs>
  <linearGradient id="shine" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="600" y2="0">
    <stop offset="0" stop-color="#111111"/><stop offset=".42" stop-color="#111111"/>
    <stop offset=".5" stop-color="#b83232"/><stop offset=".58" stop-color="#111111"/>
    <stop offset="1" stop-color="#111111"/>
    <animateTransform attributeName="gradientTransform" type="translate" values="-600 0;600 0;600 0"
      keyTimes="0;.45;1" dur="7s" begin="1.6s" repeatCount="indefinite"/>
  </linearGradient>
</defs>
<rect width="880" height="420" rx="14" fill="#f3f3f1"/>
<g class="f" style="animation-delay:0.00s">
  <rect class="live" x="48" y="49" width="8" height="8" rx="2" fill="#b83232"/>
  <text x="66" y="57" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="1" fill="#6e6e73">FULL-STACK WEB DEVELOPER · MOROCCO</text>
</g>
<text class="r" style="animation-delay:0.15s" x="44" y="190" font-family="'Instrument Serif', Georgia, serif" font-size="116" letter-spacing="-2.5" fill="#111111">Aymane</text>
<text class="r" style="animation-delay:0.30s" x="44" y="290" font-family="'Instrument Serif', Georgia, serif" font-style="italic" font-size="116" letter-spacing="-2.5" fill="url(#shine)">Chokri</text>
<g class="r" style="animation-delay:0.55s">
  <text x="48" y="338" font-family="Geist, system-ui, -apple-system, sans-serif" font-size="18" fill="#3a3a3c">I build useful web applications,</text><text x="48" y="365" font-family="Geist, system-ui, -apple-system, sans-serif" font-size="18" fill="#3a3a3c">and keep learning by building projects.</text>
</g>
<g class="f" style="animation-delay:0.80s">
  <text x="48" y="396" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#111111">github.com/aymanechoukri</text>
  <text class="nu" x="186" y="396" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#b83232">&#8599;</text>
</g>
<defs>
  <clipPath id="portraitClip"><rect x="528" y="54" width="310" height="310" rx="22"/></clipPath>
  <linearGradient id="portraitFrame" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#b83232"/><stop offset="1" stop-color="#c9a24a"/>
  </linearGradient>
</defs>
<rect x="520" y="46" width="326" height="326" rx="28" fill="url(#portraitFrame)" opacity=".95"/>
<g clip-path="url(#portraitClip)">
  <image href="data:image/jpeg;base64," x="528" y="54" width="310" height="310" preserveAspectRatio="xMidYMid meet"/>
</g>
</svg>