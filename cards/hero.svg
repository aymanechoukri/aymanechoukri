<svg xmlns="http://www.w3.org/2000/svg" width="880" height="432" viewBox="0 0 880 432" role="img" aria-label="Aymane Chokri — Full-stack web developer in Morocco"><title>Aymane Chokri — Full-stack web developer in Morocco</title><style>
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes pop{0%{opacity:0;transform:scale(.3)}70%{opacity:1;transform:scale(1.15)}100%{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes tilein{0%{opacity:0;transform:translateY(90px) scale(.6) rotate(-9deg)}55%{opacity:1;transform:translateY(-10px) scale(1.05) rotate(2deg)}100%{opacity:1;transform:none}}
@keyframes sheen{0%{transform:translateX(-220px) skewX(-20deg)}22%,100%{transform:translateX(380px) skewX(-20deg)}}
.r{opacity:0;animation:rise .8s cubic-bezier(.2,.7,.2,1) both;transform-box:fill-box}
.f{opacity:0;animation:fade .9s ease-out both}
.g{transform-box:fill-box;transform-origin:bottom;transform:scaleY(0);animation:grow .8s ease both}
.p{opacity:0;transform-box:fill-box;animation:pop .4s ease-out both}
.live{animation:pulse 1.6s ease-in-out infinite}
.ti{opacity:0;transform-box:fill-box;animation:tilein 1.1s cubic-bezier(.2,.8,.2,1) both}
.sh{animation:sheen 5s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){.r,.f,.g,.p,.live,.ti,.sh{animation:none!important;opacity:1!important;transform:none!important}.sh{display:none}}
</style>
<rect width="880" height="420" rx="14" fill="#f3f0e9"/>
<path d="M0 0H880V7H0Z" fill="#b83232"/>
<g class="f" style="animation-delay:0.00s">
 <circle class="live" cx="48" cy="48" r="4" fill="#b83232"/>
 <text x="62" y="52" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="12" letter-spacing="1.2" fill="#81766d">FULL-STACK WEB DEVELOPER · MOROCCO</text>
</g>
<text class="r" style="animation-delay:0.15s" x="42" y="188" font-family="Georgia, 'Times New Roman', serif" font-size="112" letter-spacing="-3" fill="#211f1d">Aymane</text>
<defs><linearGradient id="redshine" x1="0" x2="1"><stop offset="0" stop-color="#841e21"/><stop offset=".5" stop-color="#b83232"/><stop offset="1" stop-color="#841e21"/><animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0;-1 0" dur="7s" repeatCount="indefinite"/></linearGradient></defs>
<text class="r" style="animation-delay:0.30s" x="42" y="285" font-family="Georgia, 'Times New Roman', serif" font-size="112" font-style="italic" letter-spacing="-2" fill="url(#redshine)">Chokri</text>
<g class="r" style="animation-delay:0.55s">
 <text x="48" y="337" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#514943">I build useful web applications,</text><text x="48" y="364" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#514943">and keep learning by building projects.</text>
</g>
<g class="f" style="animation-delay:0.80s">
 <text x="48" y="399" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="13" fill="#211f1d">github.com/aymanechoukri</text>
 <text x="255" y="399" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="13" fill="#b83232">↗</text>
</g>
